<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" width="1100" height="540" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1100" height="540" fill="#0E1F16"/>
  <text x="550" y="42" text-anchor="middle" fill="#ECF3E8" font-size="23" font-weight="bold">Action-Gated User Onboarding Flow &amp; 7 Flowering Tree Growth Stages</text>

  <!-- Top Row: 6-Step Action-Gated Onboarding Flow -->
  <text x="550" y="82" text-anchor="middle" fill="#52B788" font-size="15" font-weight="bold">Part A — 6-Step Action-Gated Spotlight Guide Progression</text>
  <g transform="translate(35, 100)">
    <rect x="0" y="0" width="155" height="90" rx="12" fill="#16291F" stroke="#52B788" stroke-width="2"/>
    <text x="77" y="28" text-anchor="middle" fill="#F6BD60" font-size="12" font-weight="bold">STEP 1</text>
    <text x="77" y="50" text-anchor="middle" fill="#ECF3E8" font-size="13" font-weight="bold">Register ID</text>
    <text x="77" y="70" text-anchor="middle" fill="#B7D3C2" font-size="10.5">ID.shu.edu.pk</text>

    <rect x="175" y="0" width="155" height="90" rx="12" fill="#16291F" stroke="#52B788" stroke-width="2"/>
    <text x="252" y="28" text-anchor="middle" fill="#F6BD60" font-size="12" font-weight="bold">STEP 2</text>
    <text x="252" y="50" text-anchor="middle" fill="#ECF3E8" font-size="13" font-weight="bold">Student Log In</text>
    <text x="252" y="70" text-anchor="middle" fill="#B7D3C2" font-size="10.5">ID + Password</text>

    <rect x="350" y="0" width="155" height="90" rx="12" fill="#16291F" stroke="#52B788" stroke-width="2"/>
    <text x="427" y="28" text-anchor="middle" fill="#F6BD60" font-size="12" font-weight="bold">STEP 3</text>
    <text x="427" y="50" text-anchor="middle" fill="#ECF3E8" font-size="13" font-weight="bold">Set Exam Horizon</text>
    <text x="427" y="70" text-anchor="middle" fill="#B7D3C2" font-size="10.5">1 Wk / 1 Mo / 4 Mo</text>

    <rect x="525" y="0" width="155" height="90" rx="12" fill="#16291F" stroke="#52B788" stroke-width="2"/>
    <text x="602" y="28" text-anchor="middle" fill="#F6BD60" font-size="12" font-weight="bold">STEP 4</text>
    <text x="602" y="50" text-anchor="middle" fill="#ECF3E8" font-size="13" font-weight="bold">Create Subject</text>
    <text x="602" y="70" text-anchor="middle" fill="#B7D3C2" font-size="10.5">Inline or Subject Tab</text>

    <rect x="700" y="0" width="155" height="90" rx="12" fill="#16291F" stroke="#52B788" stroke-width="2"/>
    <text x="777" y="28" text-anchor="middle" fill="#F6BD60" font-size="12" font-weight="bold">STEP 5</text>
    <text x="777" y="50" text-anchor="middle" fill="#ECF3E8" font-size="13" font-weight="bold">Add Study Task</text>
    <text x="777" y="70" text-anchor="middle" fill="#B7D3C2" font-size="10.5">Priority &amp; Deadline</text>

    <rect x="875" y="0" width="155" height="90" rx="12" fill="#16291F" stroke="#F28482" stroke-width="2"/>
    <text x="952" y="28" text-anchor="middle" fill="#F28482" font-size="12" font-weight="bold">STEP 6</text>
    <text x="952" y="50" text-anchor="middle" fill="#ECF3E8" font-size="13" font-weight="bold">Complete Task!</text>
    <text x="952" y="70" text-anchor="middle" fill="#B7D3C2" font-size="10.5">Grows Tree + Quota</text>
  </g>

  <!-- Bottom Row: 7 Botanical Flowering Tree Growth Stages -->
  <text x="550" y="255" text-anchor="middle" fill="#F28482" font-size="15" font-weight="bold">Part B — 7 Goal-Scaled Botanical Flowering Tree Stages (0% Seed to 100% Full Bloom)</text>
  <g transform="translate(35, 280)">
    <rect x="0" y="0" width="135" height="210" rx="12" fill="#16291F" stroke="#40916C"/>
    <circle cx="67" cy="95" r="10" fill="#8C583A"/>
    <text x="67" y="155" text-anchor="middle" fill="#ECF3E8" font-size="12.5" font-weight="bold">1. Dormant Seed</text>
    <text x="67" y="178" text-anchor="middle" fill="#52B788" font-size="11.5">0% Horizon</text>

    <rect x="150" y="0" width="135" height="210" rx="12" fill="#16291F" stroke="#40916C"/>
    <line x1="217" y1="115" x2="217" y2="80" stroke="#7C5338" stroke-width="4"/>
    <circle cx="210" cy="78" r="8" fill="#52B788"/><circle cx="224" cy="78" r="8" fill="#74C69D"/>
    <text x="217" y="155" text-anchor="middle" fill="#ECF3E8" font-size="12.5" font-weight="bold">2. Tiny Sprout</text>
    <text x="217" y="178" text-anchor="middle" fill="#52B788" font-size="11.5">8% Horizon</text>

    <rect x="300" y="0" width="135" height="210" rx="12" fill="#16291F" stroke="#40916C"/>
    <line x1="367" y1="120" x2="367" y2="68" stroke="#7C5338" stroke-width="6"/>
    <circle cx="367" cy="65" r="18" fill="#40916C"/>
    <text x="367" y="155" text-anchor="middle" fill="#ECF3E8" font-size="12.5" font-weight="bold">3. Leafy Seedling</text>
    <text x="367" y="178" text-anchor="middle" fill="#52B788" font-size="11.5">22% Horizon</text>

    <rect x="450" y="0" width="135" height="210" rx="12" fill="#16291F" stroke="#40916C"/>
    <line x1="517" y1="122" x2="517" y2="60" stroke="#7C5338" stroke-width="8"/>
    <circle cx="505" cy="65" r="18" fill="#2D6A4F"/><circle cx="529" cy="65" r="18" fill="#40916C"/><circle cx="517" cy="52" r="20" fill="#52B788"/>
    <text x="517" y="155" text-anchor="middle" fill="#ECF3E8" font-size="12.5" font-weight="bold">4. Woody Sapling</text>
    <text x="517" y="178" text-anchor="middle" fill="#52B788" font-size="11.5">40% Horizon</text>

    <rect x="600" y="0" width="135" height="210" rx="12" fill="#16291F" stroke="#40916C"/>
    <line x1="667" y1="125" x2="667" y2="55" stroke="#7C5338" stroke-width="10"/>
    <circle cx="650" cy="62" r="22" fill="#2D6A4F"/><circle cx="684" cy="62" r="22" fill="#40916C"/><circle cx="667" cy="46" r="25" fill="#52B788"/>
    <text x="667" y="155" text-anchor="middle" fill="#ECF3E8" font-size="12.5" font-weight="bold">5. Young Tree</text>
    <text x="667" y="178" text-anchor="middle" fill="#52B788" font-size="11.5">60% Horizon</text>

    <rect x="750" y="0" width="135" height="210" rx="12" fill="#16291F" stroke="#40916C"/>
    <line x1="817" y1="125" x2="817" y2="50" stroke="#7C5338" stroke-width="12"/>
    <circle cx="798" cy="60" r="25" fill="#2D6A4F"/><circle cx="836" cy="60" r="25" fill="#40916C"/><circle cx="817" cy="42" r="28" fill="#52B788"/>
    <circle cx="805" cy="45" r="5" fill="#F28482"/><circle cx="830" cy="52" r="5" fill="#F6BD60"/>
    <text x="817" y="155" text-anchor="middle" fill="#ECF3E8" font-size="12.5" font-weight="bold">6. Budding Canopy</text>
    <text x="817" y="178" text-anchor="middle" fill="#52B788" font-size="11.5">80% Horizon</text>

    <rect x="900" y="0" width="135" height="210" rx="12" fill="#1D3528" stroke="#F28482" stroke-width="2.5"/>
    <line x1="967" y1="125" x2="967" y2="48" stroke="#7C5338" stroke-width="14"/>
    <circle cx="945" cy="58" r="27" fill="#2D6A4F"/><circle cx="989" cy="58" r="27" fill="#40916C"/><circle cx="967" cy="40" r="30" fill="#52B788"/>
    <circle cx="948" cy="48" r="6" fill="#F28482"/><circle cx="967" cy="32" r="6.5" fill="#F6BD60"/><circle cx="986" cy="46" r="6" fill="#F28482"/>
    <circle cx="955" cy="66" r="6" fill="#F6BD60"/><circle cx="980" cy="66" r="6" fill="#F28482"/>
    <text x="967" y="155" text-anchor="middle" fill="#F28482" font-size="12.5" font-weight="bold">7. Full Flowering</text>
    <text x="967" y="178" text-anchor="middle" fill="#F6BD60" font-size="11.5">100% Goal Bloom!</text>
  </g>
</svg>