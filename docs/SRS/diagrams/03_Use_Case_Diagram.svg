<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="1100" height="620" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1100" height="620" fill="#121624"/>
  <text x="550" y="40" text-anchor="middle" fill="#F1F5F9" font-size="24" font-weight="bold">UML Use Case Diagram — Study Planner &amp; Progress Tracker</text>
  <text x="550" y="64" text-anchor="middle" fill="#A78BFA" font-size="14">Covers All 14 User Stories (US-01 through US-14)</text>

  <!-- System Boundary Box -->
  <rect x="260" y="85" width="780" height="500" rx="18" fill="#1A2033" stroke="#A78BFA" stroke-width="2"/>
  <text x="650" y="115" text-anchor="middle" fill="#A78BFA" font-size="16" font-weight="bold">System Boundary: Botanical Study Planner &amp; Progress Tracker</text>

  <!-- Student Stick Figure Actor -->
  <circle cx="115" cy="280" r="24" fill="none" stroke="#38BDF8" stroke-width="3.5"/>
  <line x1="115" y1="304" x2="115" y2="385" stroke="#38BDF8" stroke-width="3.5"/>
  <line x1="75" y1="332" x2="155" y2="332" stroke="#38BDF8" stroke-width="3.5"/>
  <line x1="115" y1="385" x2="82" y2="440" stroke="#38BDF8" stroke-width="3.5"/>
  <line x1="115" y1="385" x2="148" y2="440" stroke="#38BDF8" stroke-width="3.5"/>
  <text x="115" y="470" text-anchor="middle" fill="#F1F5F9" font-size="16" font-weight="bold">University Student</text>
  <text x="115" y="490" text-anchor="middle" fill="#94A3B8" font-size="12">(Primary Actor)</text>

  <!-- Left Column Use Cases -->
  <g fill="#21283F" stroke="#38BDF8" stroke-width="1.8">
    <ellipse cx="455" cy="165" rx="145" ry="28"/>
    <ellipse cx="455" cy="240" rx="145" ry="28"/>
    <ellipse cx="455" cy="315" rx="145" ry="28"/>
    <ellipse cx="455" cy="390" rx="145" ry="28"/>
    <ellipse cx="455" cy="465" rx="145" ry="28"/>
    <ellipse cx="455" cy="535" rx="145" ry="28"/>
  </g>
  <g fill="#F1F5F9" font-size="12.5" font-weight="bold" text-anchor="middle">
    <text x="455" y="170">UC-01: Register &amp; Log In (ID.shu.edu.pk)</text>
    <text x="455" y="245">UC-02: Create &amp; Manage Subjects</text>
    <text x="455" y="320">UC-03: Add Tasks, Priorities &amp; Deadlines</text>
    <text x="455" y="395">UC-04: Complete Tasks &amp; Hit Daily Quota</text>
    <text x="455" y="470">UC-05: Build Weekly Study Timetable</text>
    <text x="455" y="540">UC-06: Receive Real-Time Overdue Alerts</text>
  </g>

  <!-- Right Column Use Cases -->
  <g fill="#21283F" stroke="#4ADE80" stroke-width="1.8">
    <ellipse cx="835" cy="165" rx="155" ry="28"/>
    <ellipse cx="835" cy="240" rx="155" ry="28"/>
    <ellipse cx="835" cy="315" rx="155" ry="28"/>
    <ellipse cx="835" cy="390" rx="155" ry="28"/>
    <ellipse cx="835" cy="465" rx="155" ry="28"/>
    <ellipse cx="835" cy="535" rx="155" ry="28"/>
  </g>
  <g fill="#F1F5F9" font-size="12.5" font-weight="bold" text-anchor="middle">
    <text x="835" y="170">UC-07: Run Strict Pomodoro Timer</text>
    <text x="835" y="245">UC-08: Use Stopwatch &amp; Break Coach</text>
    <text x="835" y="320">UC-09: Grow Goal-Scaled Flowering Tree</text>
    <text x="835" y="395">UC-10: View Subject &amp; Weekly Analytics</text>
    <text x="835" y="470">UC-11: Switch 11 Themes &amp; Props</text>
    <text x="835" y="540">UC-12: Play Lofi Music &amp; Export JSON</text>
  </g>

  <!-- Actor Association Lines -->
  <g stroke="#94A3B8" stroke-width="1.4" opacity="0.7">
    <line x1="165" y1="310" x2="310" y2="165"/>
    <line x1="165" y1="320" x2="310" y2="240"/>
    <line x1="165" y1="330" x2="310" y2="315"/>
    <line x1="165" y1="340" x2="310" y2="390"/>
    <line x1="165" y1="350" x2="310" y2="465"/>
    <line x1="165" y1="360" x2="310" y2="535"/>
  </g>
</svg>